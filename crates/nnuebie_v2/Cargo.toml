[package]
name = "nnuebie_v2"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
description = "Lean AVX2/VNNI NNUE evaluator adapted for oops_mate"

[lib]
name = "nnuebie_v2"
path = "src/lib.rs"

[dependencies]
oops_mate = { path = "../.." }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
overflow-checks = false
incremental = false

[profile.bench]
inherits = "release"
